<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>رعاية طبية | دخول الإدارة</title><style>body{margin:0;background:#f1f5f9;color:#12372c;font:17px system-ui;display:grid;place-items:center;min-height:100vh}main{box-sizing:border-box;background:white;padding:28px;border-radius:24px;width:min(94%,460px);text-align:center;margin:24px auto}img{width:130px}h1{font-size:28px}label{display:block;text-align:right;margin:14px 0 6px}input{box-sizing:border-box;width:100%;padding:14px;border:1px solid #b9cdc4;border-radius:12px;font:inherit}button,.button{display:block;box-sizing:border-box;width:100%;padding:14px;border:0;border-radius:12px;background:#047857;color:white;font:700 16px system-ui;text-decoration:none;margin-top:14px;cursor:pointer}button:disabled{opacity:.5}.secondary{background:#e8f3ed;color:#124b37}p{line-height:1.8}small{display:block;text-align:right;color:#566d63;line-height:1.6;margin-top:6px}[hidden]{display:none!important}#status{background:#f0f7f3;padding:12px;border-radius:12px;overflow-wrap:anywhere}</style></head><body><main><img src="assets/raaya-tibbiya-logo.png" alt="رعاية طبية"><h1>دخول الإدارة</h1><p id="status" role="status" aria-live="polite">جارٍ تجهيز تسجيل الدخول…</p><button id="verifyEmail" hidden>إرسال رابط تأكيد البريد</button><button id="checkEmail" class="secondary" hidden>تم تأكيد البريد، تحقق الآن</button><form id="emailForm"><label for="ownerEmail">البريد الإلكتروني</label><input id="ownerEmail" type="email" autocomplete="username" value="almohandissystems@gmail.com" required dir="ltr"><label for="ownerSecret">الرقم السري، 6 أحرف أو أكثر</label><input id="ownerSecret" type="password" autocomplete="current-password" minlength="6" required><button id="emailLogin" disabled>دخول بالإيميل والرقم السري</button></form><button id="login" class="secondary" disabled>الدخول باستخدام Google</button><a id="openPanel" class="button" href="./#owner" hidden>فتح لوحة الإدارة</a><form id="setupForm" hidden><label for="setupSecret">تفعيل الرقم السري الذي اخترته، 6 أحرف أو أكثر</label><input id="setupSecret" type="password" autocomplete="new-password" minlength="6" required><small>يُحفظ بأمان لدى Firebase، ولا يُنشر في التطبيق.</small><button id="setupSave">تفعيل الدخول بالرقم السري</button></form><form id="changeForm" hidden><h2>تغيير الرقم السري</h2><label for="currentSecret">الرقم السري الحالي</label><input id="currentSecret" type="password" autocomplete="current-password" required><label for="newSecret">الرقم السري الجديد، 6 أحرف أو أكثر</label><input id="newSecret" type="password" autocomplete="new-password" minlength="6" required><label for="confirmSecret">تأكيد الرقم السري الجديد</label><input id="confirmSecret" type="password" autocomplete="new-password" minlength="6" required><button id="changeSave">حفظ الرقم السري الجديد</button></form><button id="logout" class="secondary" hidden>خروج</button><a class="button secondary" href="./">الرجوع للتطبيق</a></main><script src="assets/owner-login-v3.js" defer onerror="document.getElementById('status').textContent='تعذر تحميل تسجيل الدخول. حدّث الصفحة وتحقق من الاتصال.'"></script></body></html>
